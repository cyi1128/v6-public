name: demo-cards

# 样卡演示专用：只做 workflow_dispatch（无 schedule），构建 11-06 真实数据样卡并经 PushPlus 推送。
# 与 daily-review 完全隔离，不参与任何定时推送，不影响 slot 闸门。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deps
        run: |
          python3 -V
          pip install -q -r requirements-cloud.txt || true

      - name: build-and-push
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p demo
          python3 -u tools/demo_cards.py --push 2>&1 | tee demo/run.txt

      - name: writeback-log
        if: always()
        run: |
          git config user.name cyi1128
          git config user.email cyi1128@users.noreply.github.com
          git add -f demo/run.txt demo/*.html || true
          git commit -m "demo: run log" || true
          git checkout -B demo-artifacts || true
          git push -f origin demo-artifacts || true

      - name: upload-html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-cards
          path: demo/*.html
          if-no-files-found: warn
