name: daily-review

on:
  workflow_dispatch:
    inputs:

      code:
        description: 'deep6槽位指定个股代码（如603037，留空=自动挑当日强势股）'
        required: false
        type: string
      slot:
        description: '强制时段（演示/手动）：pre/auction/tail/hourly/noon/eod/watch/warn/ext/news/news2h/evening/follow/deep6/zscan/radar/newsfire/risk/cycle，留空=按当前时刻；填 scheduler=手动启动云端自驱调度器（覆盖整段）'
        required: false
        type: choice
        options: ['scheduler', 'pre', 'auction', 'tail', 'hourly', 'noon', 'eod', 'watch', 'warn', 'ext', 'news', 'news2h', 'evening', 'follow', 'deep6', 'zscan', 'radar', 'newsfire', 'risk', 'cycle', 'demo-all', 'demo-0', 'demo-1', 'demo-2', 'demo-3']
  schedule:
    # —— 2026-11-07 全天候改造：判槽从"run 启动时刻"改为"北京时间 + 欠槽补跑"——
    # 原 6 条分散 cron 的实测问题：
    #   · 11-06 全天 schedule 实际启动时刻为 UTC 01:59/09:15/13:06/15:49/17:12/20:03/20:37/22:45，
    #     与 cron 名义时刻（UTC 0-8 = 北京 08-16）相差 2-15 小时；
    #   · 同一份 slot_done 里 11-06 缺 warn/pre/hourly10/risk1035/news1140/follow1405/eod
    #     —— 上午整段与收盘复盘全丢（eod 是用户最关心的收盘复盘）；
    #   · 11-07（周六）全天 0 次 schedule，休市日新闻彻底断供。
    # 根因是"按 run 启动时刻判槽"的 push job + 时刻表只覆盖 8-16 点。现改为：
    # 只留两条低频宽窗 cron，所有 schedule 命中一律交给 scheduler job，
    # 由调度器按北京时间 08:20…22:50 逐槽驱动，迟到/漏跳由 backfill 补跑兜住。
    #
    # ① 工作日：UTC 0-15 = 北京 08:00-23:45，每 15 分钟一次起跑机会（96 次/天），
    #    覆盖 am(08:00-11:45) / pm(12:00-16:30) / night(21:15-23:10) 三个班次的首跳。
    - cron: '*/15 0-15 * * 1-5'
    # ② 周末：UTC 0-15 = 北京 08:00-23:45，每 30 分钟一次（32 次/天）。
    #    每个两小时窗口只需命中一次，调度器走"假日快跑"分支推一次即退出。
    - cron: '*/30 0-15 * * 0,6'

concurrency:
  # 双推修复②（2026-11-04）：schedule 与 dispatch 原共用一组防双推；
  # 尾盘修复①（2026-11-05）：改为按事件类型分组——schedule 与 workflow_dispatch 各自独立并发槽，
  # 外部/手动高频 dispatch 不再挤占 schedule 槽位（此前定时 run 排队超时被取消/触发被跳过，
  # 11-05 14:55-58 尾盘 schedule 0 触发、15:00 eod 被 cancelled）。
  # schedule 组内仍串行互斥，配合 slot_done 仓库内去重防双推。
  group: daily-review-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  push:
    # 2026-11-06：定时触发一律交给下面的 scheduler job（单 run 内自驱，按分钟时刻表驱动全天），
    # 避免 push 与 scheduler 在同一分钟同时命中造成双推（用户红线）。
    # 手动 / 外部 workflow_dispatch 仍走这里，用于补推与单槽实测。
    # 2026-11-06 二次改造：slot=scheduler 的手动触发只跑下面的 scheduler job，
    # 不进本 job（否则会当成一个未知槽位空跑，且与调度器抢 slot_done）。
    # 2026-11-07 全天候改造：schedule 命中一律交给下面的 scheduler job（唯一判槽权威）。
    # 本 job 现在只服务 workflow_dispatch 手动补推/单槽实测：
    #   · slot 留空 → 走下面的 case $H:$M 按当前时刻判槽（人工排障用）；
    #   · slot 指定 → --force 强制重推该槽（去重状态仍写回）。
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.slot != 'scheduler'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 2026-11-06 工单1：装 numpy/requests，解锁 nine_score(0.10) 与 multi_factor 两个评分引擎。
      # 用 setup-python 的 pip 缓存，命中时开销约 1-2 秒；未命中约 20 秒。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt
      - name: 安装云端依赖
        run: pip install -q -r requirements-cloud.txt
      # 自检：证明 numpy/requests 落地 + 九重/多因子真出分；`|| true` 保证自检不阻断推送
      - name: 评分引擎自检（不推送）
        run: |
          python -u tools/cloud_score_bridge.py --selftest || true
          python -u strategy/theme_health.py --selftest || true
          python -u tools/strategy_tournament.py --selftest || true
          python -u tools/sentiment_cycle.py --selftest || true
          python -u tools/cloud_money_flow.py --selftest || true
          python -u tools/weekly_backtest_baseline.py --selftest || true
          python -u tools/position_sizer.py --selftest || true
          python -u tools/overnight_map.py --selftest || true
      # 双推修复③（2026-11-04）：云端每次全新 checkout，去重状态来自仓库内 tools/data/；
      # 并发 run 写回 slot_done 前先拉一次远端最新（rebase 自愈），降低旧状态覆盖/丢更新概率
      - name: 同步去重状态到最新
        run: |
          git config user.name "v6-bot"
          git config user.email "v6-bot@users.noreply.github.com"
          git pull --rebase --autostash || { git rebase --abort 2>/dev/null; git reset --hard origin/main 2>/dev/null; }
      - name: 判定时段并推送
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          INPUT_CODE: ${{ github.event.inputs.code }}
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          LOG=tools/data/step7.log
          mkdir -p tools/data
          {
            echo "=== STEP7 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "PWD=$(pwd)"
            echo "PY3=$(command -v python3 || echo MISSING)"
            python3 -V 2>&1 || true
            ls -l tools/cloud_daily_review.py || true
            python3 -c "import ast,io;ast.parse(io.open('tools/cloud_daily_review.py',encoding='utf-8').read());print('AST_OK')" 2>&1 || true
          } 2>&1 | tee -a $LOG
          case $H:$M in
            00:2[0-4])   T=warn ;;      # 08:20-08:24 北京（板块启动预警）
            00:3[0-4])   T=pre ;;       # 08:30-08:34 北京 盘前速递
            01:2[0-9])   T=auction ;;   # 09:20-09:29 竞价观察
            06:5[5-9])   T=tail ;;      # 14:55-14:59 尾盘竞价筛选（59分兜底）
            04:0[0-4]|06:0[1-4]|08:0[0-4]) T=news2h ;;  # 12:00-04/14:01-04/16:00-04 两小时汇总
            02:0[0-4]|03:0[0-4]|05:0[0-4]|06:0[0-4]) T=hourly ;;  # 10/11/13/14:00 盘中解读
            03:4[0-4])      T=news ;;       # 11:40-11:44 午间事件简报
            02:3[0-4]|05:3[0-4]) T=newsfire ;;  # 10:30-34/13:30-34 新闻发酵10条汇总
            02:3[5-9]|05:3[5-9]) T=risk ;;     # 10:35-39/13:35-39 盘中风险体检（红橙黄才推，绿静默）
            06:0[5-7])      T=follow ;;     # 14:05-14:07 跟涨三步走·盘中
            07:0[5-8])      T=follow ;;     # 15:05-15:08 跟涨三步走·收盘
            07:2[0-4])      T=cycle ;;      # 15:20-15:24 多周期视角研判（新增独立推送项目；周期标注不进竞价）
            07:1[0-4])      T=news ;;       # 15:10-15:14 尾盘事件简报
            07:3[5-9])      T=news ;;       # 15:35-15:39 尾盘事件简报
            13:3[6-9]|14:3[6-9]) T=ext ;;     # 21:38-21:39/22:38-22:39 外盘窗口
            14:5[0-9])      T=evening ;;   # 22:50-22:59 晚间消息汇总
            03:3[0-5])   T=noon ;;      # 11:30-11:35 午间作战
            07:*)        T=eod ;;       # 15:00-15:59 收盘复盘
            *)          T=watch ;;
          esac
          FORCE="${{ github.event.inputs.slot }}"
          echo "H=$H M=$M T=$T FORCE=$FORCE" 2>&1 | tee -a $LOG
          set +e
          if [ -n "$FORCE" ]; then
            python3 -u tools/cloud_daily_review.py --time $T --force "$FORCE" 2>&1 | tee -a $LOG
            RC=${PIPESTATUS[0]}
          else
            python3 tools/cloud_daily_review.py --time $T 2>&1 | tee -a $LOG
            RC=${PIPESTATUS[0]}
          fi
          echo "STEP7_RC=$RC" 2>&1 | tee -a $LOG
          exit $RC
      - name: 持久化状态文件（竞价观察仓/去重）
        if: always()
        run: |
          git config user.name "v6-bot"
          git config user.email "v6-bot@users.noreply.github.com"
          git add tools/data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 状态持久化 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; git reset --hard origin/main 2>/dev/null; git add tools/data/ 2>/dev/null; git commit -m "chore: 状态持久化(冲突自愈) $(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>/dev/null || true; }
            git push || true
          fi

  scheduler:
    # 云端自驱调度器（2026-11-06 上线）
    # 解决的问题：GitHub 对本仓库的 schedule 有系统性配额节流（实测每天约 17 次，理论应约 95 次），
    # 且早盘 08:20-09:30 连续多日整段被吞，"定时器配好了但早上就是没推送"。
    # 做法：任意一次 schedule 命中 → 本 job 在单次 run 内按分钟时刻表驱动各槽位推送，
    # 早盘跑 08:00-11:45、午后跑 13:00-15:48，无需外部 PAT、无需外部定时服务。
    # 重复推送由主程序内部 slot_done 去重兜住；同一日同一段重复起跑由 sched_active.json 标记拦截。
    # 2026-11-06 二次改造：除了 schedule 命中，也允许手动 slot=scheduler 直接拉起，
    # 用于 cron 被平台吞掉时强制接管当日剩余时段（不再依赖触发层运气）。
    # 2026-11-07 全天候改造：本 job 接管全部 schedule 命中，成为唯一判槽权威。
    # 判槽依据从"run 启动时刻"换成"北京时间 + 今日欠槽补跑"，时刻表扩到 08:20…22:50、
    # 班次扩成 am(08:00-11:45)/pm(12:00-16:30)/night(21:15-23:10)；
    # 周末休市新闻与周日因子报告都由调度器内部驱动（不再单独占 step，避免双跑）。
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.slot == 'scheduler')
    runs-on: ubuntu-latest
    # pm 段 12:00-16:30 单次驻留 270 分钟，加 checkout/装依赖/补跑余量 → 340
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 2026-11-06 工单1：装 numpy/requests，解锁 nine_score(0.10) 与 multi_factor 两个评分引擎。
      # 用 setup-python 的 pip 缓存，命中时开销约 1-2 秒；未命中约 20 秒。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt
      - name: 安装云端依赖
        run: pip install -q -r requirements-cloud.txt
      # 自检：证明 numpy/requests 落地 + 九重/多因子真出分；`|| true` 保证自检不阻断推送
      - name: 评分引擎自检（不推送）
        run: |
          python -u tools/cloud_score_bridge.py --selftest || true
          python -u strategy/theme_health.py --selftest || true
          python -u tools/strategy_tournament.py --selftest || true
          python -u tools/sentiment_cycle.py --selftest || true
          python -u tools/cloud_money_flow.py --selftest || true
          python -u tools/weekly_backtest_baseline.py --selftest || true
          python -u tools/position_sizer.py --selftest || true
          python -u tools/overnight_map.py --selftest || true
      # 调度器自检：注入固定时刻验证选槽/补跑/班次/窗口键，不联网不推送。
      # 用 `|| true` 不阻断推送，但日志里的 FAIL 必须能一眼看到（selftest 会打印逐项 PASS/FAIL）。
      - name: 调度器自检（不推送）
        run: python3 -u tools/cloud_slot_scheduler.py --selftest || true
      - name: 云端自驱调度
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 -u tools/cloud_slot_scheduler.py
