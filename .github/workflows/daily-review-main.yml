name: daily-review

on:
  push:
    # 主动触发通道（2026-11-07）：云端 job 日志匿名 API 取不到（403/404），
    # dispatch 面板会话校验也常被判 "You can't perform that action at this time"，
    # 于是改成"改代码即触发一次真实调度"：推这几个文件立刻跑一遍 scheduler，
    # 判定过程落盘 tools/data/sched_log.txt 随状态提交回仓库，用 git fetch 即可读到。
    # paths 刻意不含 tools/data/ —— 调度器自己提交状态文件不会反过来再触发，杜绝自激循环。
    branches: [main]
    paths:
      - 'tools/cloud_slot_scheduler.py'
      - 'tools/cloud_daily_review.py'
      - '.github/workflows/daily-review-main.yml'
  workflow_dispatch:
    inputs:

      code:
        description: 'deep6槽位指定个股代码（如603037，留空=自动挑当日强势股）'
        required: false
        type: string
      slot:
        description: '强制时段（演示/手动）：pre/auction/tail/hourly/noon/eod/watch/warn/ext/news/news2h/evening/follow/deep6/zscan/radar/newsfire/risk/cycle，留空=按当前时刻；填 scheduler=手动启动云端自驱调度器（覆盖整段）'
        required: false
        type: choice
        options: ['scheduler', 'pre', 'auction', 'tail', 'hourly', 'noon', 'eod', 'watch', 'warn', 'ext', 'news', 'news2h', 'evening', 'follow', 'deep6', 'zscan', 'radar', 'newsfire', 'risk', 'cycle', 'demo-all', 'demo-0', 'demo-1', 'demo-2', 'demo-3', 'demo-4', 'demo-5', 'demo-6']
  schedule:
    # —— 2026-11-07 全天候改造：判槽从"run 启动时刻"改为"北京时间 + 欠槽补跑"——
    # 原 6 条分散 cron 的实测问题：
    #   · 11-06 全天 schedule 实际启动时刻为 UTC 01:59/09:15/13:06/15:49/17:12/20:03/20:37/22:45，
    #     与 cron 名义时刻（UTC 0-8 = 北京 08-16）相差 2-15 小时；
    #   · 同一份 slot_done 里 11-06 缺 warn/pre/hourly10/risk1035/news1140/follow1405/eod
    #     —— 上午整段与收盘复盘全丢（eod 是用户最关心的收盘复盘）；
    #   · 11-07（周六）全天 0 次 schedule，休市日新闻彻底断供。
    # 根因是"按 run 启动时刻判槽"的 push job + 时刻表只覆盖 8-16 点。现改为：
    # 只留两条低频宽窗 cron，所有 schedule 命中一律交给 scheduler job，
    # 由调度器按北京时间 08:20…22:50 逐槽驱动，迟到/漏跳由 backfill 补跑兜住。
    #
    # ① 全周统一一条：UTC 0-15 = 北京 08:00-23:45，每 15 分钟一次起跑机会（64 次/天）。
    #    不再按星期几拆 cron——11-07(周六) 实测 `*/30 0-15 * * 0,6` 全天 0 次触发，
    #    说明平台对"周末专属 cron"可能整段丢弃；改走同一条全周管道，由调度器自己分流：
    #    工作日按 FIXED_SLOTS 逐槽驱动，周末走"假日快跑"分支（每两小时一个窗口）。
    # 2026-11-14：本地 Windows 计划任务（25 个精确时刻触发器）已全部禁用，推送改为纯云端。
    # 补偿：启动机会从 64 次/天加密到 192 次/天。实测当天 08:00-12:15 之间云端零启动，
    # 08 点与 10 点两个窗口直接漏推，所以必须靠更高的触发冗余把这种整段空洞填住。
    # 一旦某次启动成功，scheduler 就自己滚动驱动 300+45 分钟并 backfill 补跑，不依赖后续 cron。
    - cron: '*/5 0-15 * * *'

concurrency:
  # 双推修复②（2026-11-04）：schedule 与 dispatch 原共用一组防双推；
  # 尾盘修复①（2026-11-05）：改为按事件类型分组——schedule 与 workflow_dispatch 各自独立并发槽，
  # 外部/手动高频 dispatch 不再挤占 schedule 槽位（此前定时 run 排队超时被取消/触发被跳过，
  # 11-05 14:55-58 尾盘 schedule 0 触发、15:00 eod 被 cancelled）。
  # schedule 组内仍串行互斥，配合 slot_done 仓库内去重防双推。
  # 2026-11-09：再按 slot 细分。scheduler 段一次占 350 分钟，若与单槽实测/补推同组，
  # 后者会一直挂 pending 排队；按 slot 拆开后互不阻塞（去重仍由 tools/data/slot_done.json 保证）。
  group: daily-review-${{ github.event_name }}-${{ github.event.inputs.slot || 'cron' }}
  cancel-in-progress: false

jobs:
  push:
    # 2026-11-06：定时触发一律交给下面的 scheduler job（单 run 内自驱，按分钟时刻表驱动全天），
    # 避免 push 与 scheduler 在同一分钟同时命中造成双推（用户红线）。
    # 手动 / 外部 workflow_dispatch 仍走这里，用于补推与单槽实测。
    # 2026-11-06 二次改造：slot=scheduler 的手动触发只跑下面的 scheduler job，
    # 不进本 job（否则会当成一个未知槽位空跑，且与调度器抢 slot_done）。
    # 2026-11-07 全天候改造：schedule 命中一律交给下面的 scheduler job（唯一判槽权威）。
    # 本 job 现在只服务 workflow_dispatch 手动补推/单槽实测：
    #   · slot 留空 → 走下面的 case $H:$M 按当前时刻判槽（人工排障用）；
    #   · slot 指定 → --force 强制重推该槽（去重状态仍写回）。
    # 2026-11-09 加：push 事件里 commit message 带 [run-now] 时，本 job 跑一轮指定卡实测，
    # 用于「不依赖 page_dispatch、直接把改过的卡真推到微信验证」。
    if: >
      (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.slot != 'scheduler') ||
      (github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[run-now]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 2026-11-06 工单1：装 numpy/requests，解锁 nine_score(0.10) 与 multi_factor 两个评分引擎。
      # 用 setup-python 的 pip 缓存，命中时开销约 1-2 秒；未命中约 20 秒。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt
      - name: 安装云端依赖
        run: pip install -q -r requirements-cloud.txt
      # 自检：证明 numpy/requests 落地 + 九重/多因子真出分；`|| true` 保证自检不阻断推送
      - name: 评分引擎自检（不推送）
        run: |
          python -u tools/cloud_score_bridge.py --selftest || true
          python -u strategy/theme_health.py --selftest || true
          python -u tools/strategy_tournament.py --selftest || true
          python -u tools/sentiment_cycle.py --selftest || true
          python -u tools/cloud_money_flow.py --selftest || true
          python -u tools/weekly_backtest_baseline.py --selftest || true
          python -u tools/position_sizer.py --selftest || true
          python -u tools/overnight_map.py --selftest || true
      # 双推修复③（2026-11-04）：云端每次全新 checkout，去重状态来自仓库内 tools/data/；
      # 并发 run 写回 slot_done 前先拉一次远端最新（rebase 自愈），降低旧状态覆盖/丢更新概率
      - name: 同步去重状态到最新
        run: |
          git config user.name "v6-bot"
          git config user.email "v6-bot@users.noreply.github.com"
          git pull --rebase --autostash || { git rebase --abort 2>/dev/null; git reset --hard origin/main 2>/dev/null; }
      - name: 判定时段并推送
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          INPUT_CODE: ${{ github.event.inputs.code }}
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          LOG=tools/data/step7.log
          mkdir -p tools/data
          {
            echo "=== STEP7 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "PWD=$(pwd)"
            echo "PY3=$(command -v python3 || echo MISSING)"
            python3 -V 2>&1 || true
            ls -l tools/cloud_daily_review.py || true
            python3 -c "import ast,io;ast.parse(io.open('tools/cloud_daily_review.py',encoding='utf-8').read());print('AST_OK')" 2>&1 || true
          } 2>&1 | tee -a $LOG
          case $H:$M in
            00:2[0-4])   T=warn ;;      # 08:20-08:24 北京（板块启动预警）
            00:3[0-4])   T=pre ;;       # 08:30-08:34 北京 盘前速递
            01:2[0-9])   T=auction ;;   # 09:20-09:29 竞价观察
            06:5[5-9])   T=tail ;;      # 14:55-14:59 尾盘竞价筛选（59分兜底）
            04:0[0-4]|06:0[1-4]|08:0[0-4]) T=news2h ;;  # 12:00-04/14:01-04/16:00-04 两小时汇总
            02:0[0-4]|03:0[0-4]|05:0[0-4]|06:0[0-4]) T=hourly ;;  # 10/11/13/14:00 盘中解读
            03:4[0-4])      T=news ;;       # 11:40-11:44 午间事件简报
            02:3[0-4]|05:3[0-4]) T=newsfire ;;  # 10:30-34/13:30-34 新闻发酵10条汇总
            02:3[5-9]|05:3[5-9]) T=risk ;;     # 10:35-39/13:35-39 盘中风险体检（红橙黄才推，绿静默）
            06:0[5-7])      T=follow ;;     # 14:05-14:07 跟涨三步走·盘中
            07:0[5-8])      T=follow ;;     # 15:05-15:08 跟涨三步走·收盘
            07:2[0-4])      T=cycle ;;      # 15:20-15:24 多周期视角研判（新增独立推送项目；周期标注不进竞价）
            07:1[0-4])      T=news ;;       # 15:10-15:14 尾盘事件简报
            07:3[5-9])      T=news ;;       # 15:35-15:39 尾盘事件简报
            13:3[6-9]|14:3[6-9]) T=ext ;;     # 21:38-21:39/22:38-22:39 外盘窗口
            14:5[0-9])      T=evening ;;   # 22:50-22:59 晚间消息汇总
            03:3[0-5])   T=noon ;;      # 11:30-11:35 午间作战
            07:*)        T=eod ;;       # 15:00-15:59 收盘复盘
            *)          T=watch ;;
          esac
          # 2026-11-09：push 带 [run-now] 时，一次跑完这几张改造过的卡并真推送（--force 跳过去重）。
          if [ "${{ contains(github.event.head_commit.message, '[run-now]') }}" = "true" ]; then
            for SL in news2h risk newsfire follow noon pre; do
              echo "===== RUN-NOW $SL =====" 2>&1 | tee -a $LOG
              python3 -u tools/cloud_daily_review.py --time "$SL" --force "$SL" 2>&1 | tee -a $LOG
            done
            exit 0
          fi
          FORCE="${{ github.event.inputs.slot }}"
          echo "H=$H M=$M T=$T FORCE=$FORCE" 2>&1 | tee -a $LOG
          set +e
          if [ -n "$FORCE" ]; then
            python3 -u tools/cloud_daily_review.py --time $T --force "$FORCE" 2>&1 | tee -a $LOG
            RC=${PIPESTATUS[0]}
          else
            python3 tools/cloud_daily_review.py --time $T 2>&1 | tee -a $LOG
            RC=${PIPESTATUS[0]}
          fi
          echo "STEP7_RC=$RC" 2>&1 | tee -a $LOG
          exit $RC
      - name: 持久化状态文件（竞价观察仓/去重）
        if: always()
        run: |
          git config user.name "v6-bot"
          git config user.email "v6-bot@users.noreply.github.com"
          git add tools/data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 状态持久化 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git pull --rebase --autostash || { git rebase --abort 2>/dev/null; git reset --hard origin/main 2>/dev/null; git add tools/data/ 2>/dev/null; git commit -m "chore: 状态持久化(冲突自愈) $(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>/dev/null || true; }
            git push || true
          fi

  scheduler:
    # 云端自驱调度器（2026-11-06 上线）
    # 解决的问题：GitHub 对本仓库的 schedule 有系统性配额节流（实测每天约 17 次，理论应约 95 次），
    # 且早盘 08:20-09:30 连续多日整段被吞，"定时器配好了但早上就是没推送"。
    # 做法：任意一次 schedule 命中 → 本 job 在单次 run 内按分钟时刻表驱动各槽位推送，
    # 早盘跑 08:00-11:45、午后跑 13:00-15:48，无需外部 PAT、无需外部定时服务。
    # 重复推送由主程序内部 slot_done 去重兜住；同一日同一段重复起跑由 sched_active.json 标记拦截。
    # 2026-11-06 二次改造：除了 schedule 命中，也允许手动 slot=scheduler 直接拉起，
    # 用于 cron 被平台吞掉时强制接管当日剩余时段（不再依赖触发层运气）。
    # 2026-11-07 全天候改造：本 job 接管全部 schedule 命中，成为唯一判槽权威。
    # 判槽依据从"run 启动时刻"换成"北京时间 + 今日欠槽补跑"，时刻表扩到 08:20…22:50、
    # 班次扩成 am(08:00-11:45)/pm(12:00-16:30)/night(21:15-23:10)；
    # 周末休市新闻与周日因子报告都由调度器内部驱动（不再单独占 step，避免双跑）。
    # 2026-11-07 二次改造：判槽从"固定三段班次"换成"滚动占段"——
    # 任何一次触发都吃满接下来 300 分钟（段尾 45 分钟内还能接上下一槽就延长），
    # 因为实测 schedule 延迟 2-15 小时（11-06 八次 run 只有一次落在上午班次内）。
    # 周末休市新闻与周日因子报告都由调度器内部驱动（不再单独占 step，避免双跑）。
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.slot == 'scheduler')
    runs-on: ubuntu-latest
    # 滚动段最长 300 + 45 分钟延伸 = 345，加 checkout/装依赖/自检余量 → 380
    timeout-minutes: 355   # v80-E15/16：段落最长 320 分钟，平台 job 硬上限 360，这里留 35 分钟给收尾+接力
    permissions:
      contents: write
      actions: write   # 2026-11-10：自我接力需要能 dispatch 本 workflow
    steps:
      - uses: actions/checkout@v4
      # 2026-11-06 工单1：装 numpy/requests，解锁 nine_score(0.10) 与 multi_factor 两个评分引擎。
      # 用 setup-python 的 pip 缓存，命中时开销约 1-2 秒；未命中约 20 秒。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-cloud.txt
      - name: 安装云端依赖
        run: pip install -q -r requirements-cloud.txt
      # 自检：证明 numpy/requests 落地 + 九重/多因子真出分；`|| true` 保证自检不阻断推送
      - name: 评分引擎自检（不推送）
        run: |
          python -u tools/cloud_score_bridge.py --selftest || true
          python -u strategy/theme_health.py --selftest || true
          python -u tools/strategy_tournament.py --selftest || true
          python -u tools/sentiment_cycle.py --selftest || true
          python -u tools/cloud_money_flow.py --selftest || true
          python -u tools/weekly_backtest_baseline.py --selftest || true
          python -u tools/position_sizer.py --selftest || true
          python -u tools/overnight_map.py --selftest || true
      # 调度器自检：注入固定时刻验证选槽/补跑/班次/窗口键，不联网不推送。
      # 用 `|| true` 不阻断推送，但日志里的 FAIL 必须能一眼看到（selftest 会打印逐项 PASS/FAIL）。
      - name: 调度器自检（不推送）
        run: python3 -u tools/cloud_slot_scheduler.py --selftest || true
      # 演示全跑（2026-11-07）：commit message 带 [demo] 才触发，跑全部 18 个推送模块，
      # 逐个真推到 PushPlus 微信，用户直接看真实卡效果；日志 demo.log 随状态提交回仓库可复核。
      - name: 演示全跑（commit 带 [demo] 时）
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[demo]')
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          mkdir -p tools/data
          python3 -u tools/cloud_daily_review.py --demo-all 2>&1 | tee -a tools/data/demo_run.txt
      - name: 提交演示日志
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[demo]')
        run: |
          git config user.name "v6-bot"
          git config user.email "v6-bot@users.noreply.github.com"
          cp /tmp/demo_trace.txt tools/data/demo_trace.txt 2>/dev/null || true
          git add tools/data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: 演示日志 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            git pull --rebase --autostash || true
            git push || true
          fi
      - name: 云端自驱调度
        id: drive
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(github.event.head_commit.message, '[demo]') }}" = "true" ]; then
            echo "本次为演示 run，跳过常规调度（避免同一次 run 再推正常槽位造成混淆）"
            exit 0
          fi
          _T0=$(date +%s)
          python3 -u tools/cloud_slot_scheduler.py || echo "scheduler_exit=$?"
          # v80-E15/16：无论调度器正常结束还是被中断，drive_sec 都必须写进 GITHUB_OUTPUT。
          # 原来 bash -e 下非零退出会直接打断本 step，drive_sec 为空 → 接力判据当 0 → 跳过接力，
          # 于是 11-10 21:52 之后整整空窗 50 分钟。
          echo "drive_sec=$(( $(date +%s) - _T0 ))" >> "$GITHUB_OUTPUT"
      # ===== 2026-11-10 自我接力（治「定时不推」的根本原因）=====
      # 实测：本仓库 schedule 被平台系统性节流——11-09 名义 96 次只真触发 3 次，
      # 11-10 全天 0 次 run（用户当天从早上 09:30 之后一整天没收到任何推送）。
      # cron 不能指望，于是把一个 run 变成「一棒接一棒」：
      # 本次调度器已释放段标记后，用 GITHUB_TOKEN 预约下一次 slot=scheduler 的 dispatch，
      # 新 run 在 concurrency 组内排队，本次一结束立刻接上，全天不再断档。
      # 三重防滥用：① 只在 UTC 0-15（北京 08:00-23:45）接力；
      #            ② 本次真跑够 10 分钟才接力（空转 idle run 不接力，避免烧额度）；
      #            ③ 演示 run([demo]) 不接力。
      - name: 预约下一棒（cron 被吞时的兜底接力）
        if: always() && github.event.inputs.slot != 'demo-all' && !contains(github.event.head_commit.message, '[demo]') && !contains(github.event.head_commit.message, '[run-now]')
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVE_SEC: ${{ steps.drive.outputs.drive_sec }}
        run: |
          H=$(date -u +%H)
          if [ "$H" -lt 0 ] || [ "$H" -gt 15 ]; then
            echo "RELAY_SKIP 非推送时段 UTC H=$H"
            exit 0
          fi
          # v80-E15/16：DRIVE_SEC 为空说明 drive step 异常退出（被 timeout 杀 / 非零码），
          # 这种时候比正常跑满更需要下一棒，绝不能当 0 跳过。
          if [ -n "${DRIVE_SEC}" ] && [ "${DRIVE_SEC}" -lt 600 ]; then
            echo "RELAY_SKIP 本次只跑了 ${DRIVE_SEC}s（<600s），不接力"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/relay_body.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-review-main.yml/dispatches" \
            -d '{"ref":"main","inputs":{"slot":"scheduler"}}' || echo 000)
          echo "RELAY_HTTP=$CODE drive_sec=${DRIVE_SEC}"
          if [ "$CODE" != "204" ]; then
            head -c 400 /tmp/relay_body.txt 2>/dev/null || true
          fi
