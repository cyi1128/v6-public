name: diag-step7-once

# 临时诊断：复刻 daily-review push job 的环境（setup-python 3.11 + 相同 secrets），
# 跑一次 step7 主程序并把完整输出写回仓库 d.txt，供离线读取定位失败根因。
# 定位完成后本文件即删除。

on:
  push:
    paths:
      - '.github/workflows/diag-step7-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag-step7-once
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deps
        run: |
          pip install -q -r requirements-cloud.txt 2>&1 | tail -5 || true

      - name: diag
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set +e
          LOG=d.txt
          : > $LOG
          {
            echo "=== DIAG START $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "PWD=$(pwd)"
            echo "PY3=$(command -v python3)"
            python3 -V
            ls -l tools/cloud_daily_review.py
            echo "MS_KEY_SET=$([ -n "$MODELSCOPE_API_KEY" ] && echo YES || echo NO)"
            echo "PUSH_SET=$([ -n "$PUSHPLUS_TOKEN" ] && echo YES || echo NO)"
            python3 -c "import ast,io;ast.parse(io.open('tools/cloud_daily_review.py',encoding='utf-8').read());print('AST_OK')"
          } 2>&1 | tee -a $LOG
          python3 -u tools/cloud_daily_review.py --time watch --force news2h 2>&1 | tee -a $LOG
          echo "STEP7_RC=${PIPESTATUS[0]}" | tee -a $LOG

      - name: save
        if: always()
        run: |
          git config user.name "v6-bot"
          git config user.email "v6-bot@users.noreply.github.com"
          git add d.txt || true
          git diff --cached --quiet || git commit -m "chore: diag step7 log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash || true
          git push || true
