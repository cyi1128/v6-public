<html style="margin:0;padding:0;">
<div style="background-color:transparent;box-sizing:border-box;font-family:'PingFang SC','Segoe UI',Arial,sans-serif;padding:6px 0;">
  <div style="font-size:14px;font-weight:600;color:#1A1B1C;margin-bottom:4px;">机会状态机（第4层内部 · 6 个有效状态 + 终止态）</div>
  <div style="font-size:11.5px;color:#6B7280;margin-bottom:6px;">每只股每轮最多推进一次（processed 集合防连跳）</div>
  <svg font-family="'PingFang SC','Microsoft YaHei','Segoe UI',Arial,sans-serif" viewBox="0 0 860 356" style="width:100%;height:auto;display:block;" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#B9B9B3"/>
      </marker>
      <marker id="ah2r" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#EA6668"/>
      </marker>
    </defs>

    <!-- 主链 4 态 -->
    <rect x="40" y="40" width="150" height="54" rx="12" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="115" y="63" font-size="12.5" font-weight="600" fill="#1A1B1C" text-anchor="middle">预备</text>
    <text x="115" y="80" font-size="10" fill="#6B7280" text-anchor="middle">自身未动</text>

    <rect x="250" y="40" width="150" height="54" rx="12" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="325" y="63" font-size="12.5" font-weight="600" fill="#1A1B1C" text-anchor="middle">初步联动</text>
    <text x="325" y="80" font-size="10" fill="#6B7280" text-anchor="middle">首次异动</text>

    <rect x="460" y="40" width="150" height="54" rx="12" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="535" y="63" font-size="12.5" font-weight="600" fill="#1A1B1C" text-anchor="middle">二次异动</text>
    <text x="535" y="80" font-size="10" fill="#6B7280" text-anchor="middle">计数 ≥ 2</text>

    <rect x="670" y="40" width="150" height="54" rx="12" fill="#ECF8F4" stroke="#B4E4D5" stroke-width="1"/>
    <text x="745" y="63" font-size="12.5" font-weight="600" fill="#1A1B1C" text-anchor="middle">联动确认</text>
    <text x="745" y="80" font-size="10" fill="#6B7280" text-anchor="middle">扩散未停止</text>

    <path d="M190,67 L250,67" stroke="#B9B9B3" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="220" y="60" font-size="9.5" fill="#6B7280" text-anchor="middle">首次异动</text>
    <path d="M400,67 L460,67" stroke="#B9B9B3" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="430" y="60" font-size="9.5" fill="#6B7280" text-anchor="middle">二次异动</text>
    <path d="M610,67 L670,67" stroke="#B9B9B3" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="640" y="60" font-size="9.5" fill="#6B7280" text-anchor="middle">扩散有效</text>

    <!-- 冷却观察 -->
    <rect x="250" y="140" width="150" height="54" rx="12" fill="#FFFFFF" stroke="#E4E3DD" stroke-width="1"/>
    <text x="325" y="163" font-size="12.5" font-weight="600" fill="#1A1B1C" text-anchor="middle">冷却观察</text>
    <text x="325" y="180" font-size="10" fill="#6B7280" text-anchor="middle">等二次确认</text>
    <path d="M325,94 L325,140" stroke="#B9B9B3" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="333" y="121" font-size="9.5" fill="#6B7280">120秒内无二次</text>
    <path d="M400,167 L460,167 L460,94" stroke="#B9B9B3" stroke-width="1.6" fill="none" marker-end="url(#ah2)"/>
    <text x="470" y="167" font-size="9.5" fill="#6B7280">出现二次异动</text>

    <!-- ATR跟踪 -->
    <rect x="670" y="140" width="150" height="54" rx="12" fill="#E1F4EE" stroke="#A4DECC" stroke-width="1"/>
    <text x="745" y="163" font-size="12.5" font-weight="600" fill="#1A1B1C" text-anchor="middle">ATR跟踪</text>
    <text x="745" y="180" font-size="10" fill="#6B7280" text-anchor="middle">只读刷新参考位</text>
    <path d="M745,94 L745,140" stroke="#B9B9B3" stroke-width="1.6" marker-end="url(#ah2)"/>
    <text x="753" y="121" font-size="9.5" fill="#6B7280">确认后自动</text>

    <!-- 终止态：底部横带 -->
    <rect x="40" y="270" width="780" height="64" rx="12" fill="#FDF0F0" stroke="#F3ABAC" stroke-width="1"/>
    <text x="60" y="294" font-size="12.5" font-weight="600" fill="#C04547">失效 / 已启动（不再输出到任何界面）</text>
    <text x="60" y="314" font-size="10.5" fill="#6B7280">扩散停止　·　加速过快（加速≥3 且 涨幅≥6%）　·　15分钟无推进　·　涨幅≥8%（已启动）</text>

    <!-- 失效虚线：从各有效状态底部接入终止带 -->
    <path d="M115,94 L115,270" stroke="#EA6668" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ah2r)"/>
    <path d="M325,194 L325,270" stroke="#EA6668" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ah2r)"/>
    <path d="M535,94 L535,270" stroke="#EA6668" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ah2r)"/>
    <path d="M745,194 L745,270" stroke="#EA6668" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ah2r)"/>
    <text x="125" y="246" font-size="9.5" fill="#C04547">任何有效状态都可能直接失效</text>

    <!-- 图例 -->
    <text x="40" y="224" font-size="10.5" fill="#6B7280">灰实线 = 正常推进　｜　红虚线 = 失效路径</text>
  </svg>
  <div style="font-size:11px;color:#6B7280;line-height:1.75;margin-top:4px;">
    进入本状态机的前置门槛：集群未扩散停止 · 集群活跃数 ≥2 · 自身涨幅 0.3%~8% · 现价 ≥MA20 · 关系有效<br/>
    企业微信只推「联动确认」「二次异动」「已启动」；预备/初步联动/冷却/ATR 只在界面显示<br/>
    金铲子与盘中机会都接收全部 6 个有效状态，盘中机会额外截断 50 条
  </div>
</div>
</html>
